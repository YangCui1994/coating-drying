<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">LFP–PVDF/NMP 厚极片干燥事件、厚向状态与失效时间轴</title>
  <desc id="desc">展示 E0 边界接通、可选 E1 局部锁定、E2 全层承载、E3 气体侵入、E4 液路断连、E6 残余 NMP 达标。E5 首次失效用可移动红色菱形表示，可发生在不同区间。下部曲线定性展示厚度、蒸发通量、液体饱和度和模量的演变。</desc>
  <defs>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe5ff"/>
      <stop offset="1" stop-color="#4f9ed8"/>
    </linearGradient>
    <linearGradient id="dry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8edf7"/>
      <stop offset="1" stop-color="#b8c8d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <style>
      .cn { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #152536; }
      .subtitle { font-size: 21px; fill: #526575; }
      .event { font-size: 25px; font-weight: 700; fill: #16324a; }
      .small { font-size: 18px; fill: #526575; }
      .label { font-size: 21px; font-weight: 650; fill: #253746; }
      .tiny { font-size: 16px; fill: #526575; }
      .axis { stroke: #6c7f8d; stroke-width: 3; }
      .guide { stroke: #c6d0d8; stroke-width: 2; stroke-dasharray: 6 8; }
      .particle { fill: #5ea65c; stroke: #2f6b38; stroke-width: 1.5; }
      .carbon { fill: #374151; }
      .binder { fill: #f59e0b; }
      .gas { fill: #ffffff; stroke: #8aa4b5; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#f7fafc"/>
  <text x="90" y="72" class="cn title">厚极片干燥不是七个固定阶段，而是一组可测事件</text>
  <text x="90" y="108" class="cn subtitle">典型主干可为 E0&lt;E1≤E2≲E3&lt;E4&lt;E6；E1 可缺失，E3 可重叠，E5 可在任意区间发生</text>

  <!-- Timeline -->
  <line x1="120" y1="205" x2="1680" y2="205" class="axis"/>
  <polygon points="1680,205 1658,193 1658,217" fill="#6c7f8d"/>
  <text x="1590" y="183" class="cn small">材料经历时间 t=x/Uweb</text>

  <g class="cn">
    <g transform="translate(205,205)">
      <circle r="11" fill="#2f7db6"/>
      <line y1="14" y2="66" stroke="#2f7db6" stroke-width="3"/>
      <text x="0" y="-22" text-anchor="middle" class="event">E0</text>
      <text x="0" y="91" text-anchor="middle" class="small">边界接通</text>
    </g>
    <g transform="translate(455,205)">
      <circle r="11" fill="#f59e0b"/>
      <line y1="14" y2="66" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 7"/>
      <text x="0" y="-22" text-anchor="middle" class="event" fill="#a96300">E1</text>
      <text x="0" y="91" text-anchor="middle" class="small">局部机械锁定</text>
      <text x="0" y="115" text-anchor="middle" class="tiny">可选；不是结皮同义词</text>
    </g>
    <g transform="translate(700,205)">
      <circle r="11" fill="#4a7f3f"/>
      <line y1="14" y2="66" stroke="#4a7f3f" stroke-width="3"/>
      <text x="0" y="-22" text-anchor="middle" class="event">E2</text>
      <text x="0" y="91" text-anchor="middle" class="small">全层承载/收缩平台</text>
    </g>
    <g transform="translate(955,205)">
      <circle r="11" fill="#3f8fc2"/>
      <line y1="14" y2="66" stroke="#3f8fc2" stroke-width="3"/>
      <text x="0" y="-22" text-anchor="middle" class="event">E3</text>
      <text x="0" y="91" text-anchor="middle" class="small">外界气体侵入</text>
    </g>
    <g transform="translate(1215,205)">
      <circle r="11" fill="#5f6f7a"/>
      <line y1="14" y2="66" stroke="#5f6f7a" stroke-width="3"/>
      <text x="0" y="-22" text-anchor="middle" class="event">E4</text>
      <text x="0" y="91" text-anchor="middle" class="small">连续供液断开</text>
    </g>
    <g transform="translate(1530,205)">
      <circle r="11" fill="#263746"/>
      <line y1="14" y2="66" stroke="#263746" stroke-width="3"/>
      <text x="0" y="-22" text-anchor="middle" class="event">E6</text>
      <text x="0" y="91" text-anchor="middle" class="small">残余 NMP 达标</text>
    </g>
  </g>

  <!-- E5 cross-cut -->
  <line x1="295" y1="145" x2="1460" y2="145" stroke="#d94841" stroke-width="4" stroke-dasharray="12 8"/>
  <polygon points="650,126 669,145 650,164 631,145" fill="#d94841"/>
  <polygon points="1040,126 1059,145 1040,164 1021,145" fill="#d94841" opacity="0.55"/>
  <text x="875" y="136" text-anchor="middle" class="cn label" fill="#a62d2a">E5：首次不可逆失效是横切事件，红菱形位置由数据决定</text>

  <!-- Cross-section cards -->
  <g filter="url(#shadow)">
    <rect x="90" y="335" width="290" height="330" rx="18" fill="#ffffff"/>
    <rect x="410" y="335" width="290" height="330" rx="18" fill="#ffffff"/>
    <rect x="730" y="335" width="290" height="330" rx="18" fill="#ffffff"/>
    <rect x="1050" y="335" width="290" height="330" rx="18" fill="#ffffff"/>
    <rect x="1370" y="335" width="340" height="330" rx="18" fill="#ffffff"/>
  </g>

  <!-- Card 1 mobile -->
  <text x="235" y="374" text-anchor="middle" class="cn label">E0→锁定前：仍可流动</text>
  <rect x="125" y="585" width="220" height="34" rx="4" fill="#aeb9c1"/>
  <rect x="125" y="430" width="220" height="155" rx="5" fill="url(#wet)" stroke="#3f8fc2" stroke-width="2"/>
  <path d="M160 412 L160 378 M235 412 L235 378 M310 412 L310 378" stroke="#2f7db6" stroke-width="3"/>
  <polygon points="160,378 151,393 169,393" fill="#2f7db6"/>
  <polygon points="235,378 226,393 244,393" fill="#2f7db6"/>
  <polygon points="310,378 301,393 319,393" fill="#2f7db6"/>
  <g class="particle">
    <circle cx="150" cy="472" r="14"/><circle cx="194" cy="508" r="16"/><circle cx="246" cy="461" r="15"/>
    <circle cx="302" cy="512" r="18"/><circle cx="154" cy="552" r="17"/><circle cx="236" cy="548" r="19"/>
    <circle cx="312" cy="558" r="14"/>
  </g>
  <circle cx="218" cy="486" r="5" class="carbon"/><circle cx="277" cy="539" r="5" class="carbon"/>
  <path d="M184 451 Q215 436 260 450" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <text x="235" y="646" text-anchor="middle" class="cn tiny">厚度下降；组分迁移/流平</text>

  <!-- Card 2 optional skin -->
  <text x="555" y="374" text-anchor="middle" class="cn label">E1&lt;E2：可选表层锁定</text>
  <rect x="445" y="585" width="220" height="34" rx="4" fill="#aeb9c1"/>
  <rect x="445" y="444" width="220" height="141" rx="5" fill="url(#wet)" stroke="#3f8fc2" stroke-width="2"/>
  <rect x="445" y="444" width="220" height="28" fill="#f4b64f" fill-opacity="0.65" stroke="#d28708" stroke-width="2" stroke-dasharray="8 6"/>
  <g class="particle">
    <circle cx="474" cy="465" r="13"/><circle cx="516" cy="460" r="14"/><circle cx="560" cy="462" r="14"/>
    <circle cx="605" cy="461" r="13"/><circle cx="645" cy="463" r="12"/>
    <circle cx="478" cy="506" r="15"/><circle cx="533" cy="526" r="17"/><circle cx="602" cy="512" r="16"/>
    <circle cx="474" cy="558" r="16"/><circle cx="575" cy="560" r="18"/><circle cx="636" cy="548" r="15"/>
  </g>
  <path d="M472 425 L472 394 M555 425 L555 394 M638 425 L638 394" stroke="#2f7db6" stroke-width="3"/>
  <polygon points="472,394 463,409 481,409" fill="#2f7db6"/>
  <polygon points="555,394 546,409 564,409" fill="#2f7db6"/>
  <polygon points="638,394 629,409 647,409" fill="#2f7db6"/>
  <text x="555" y="646" text-anchor="middle" class="cn tiny">仅在表层 E/k/屈服对比成立时启用</text>

  <!-- Card 3 saturated locked -->
  <text x="875" y="374" text-anchor="middle" class="cn label">E2→E3：承载但仍饱和</text>
  <rect x="765" y="585" width="220" height="34" rx="4" fill="#aeb9c1"/>
  <rect x="765" y="475" width="220" height="110" rx="5" fill="#65a9d1" stroke="#2f7db6" stroke-width="2"/>
  <g class="particle">
    <circle cx="790" cy="499" r="15"/><circle cx="827" cy="515" r="17"/><circle cx="871" cy="497" r="16"/>
    <circle cx="915" cy="516" r="18"/><circle cx="959" cy="498" r="15"/>
    <circle cx="791" cy="553" r="17"/><circle cx="840" cy="558" r="16"/><circle cx="890" cy="551" r="18"/>
    <circle cx="940" cy="555" r="17"/><circle cx="973" cy="555" r="11"/>
  </g>
  <path d="M796 458 L796 418 M875 458 L875 418 M956 458 L956 418" stroke="#2f7db6" stroke-width="3"/>
  <polygon points="796,418 787,433 805,433" fill="#2f7db6"/>
  <polygon points="875,418 866,433 884,433" fill="#2f7db6"/>
  <polygon points="956,418 947,433 965,433" fill="#2f7db6"/>
  <path d="M805 565 L784 565 M945 565 L966 565" stroke="#d94841" stroke-width="4"/>
  <polygon points="784,565 799,556 799,574" fill="#d94841"/>
  <polygon points="966,565 951,556 951,574" fill="#d94841"/>
  <text x="875" y="646" text-anchor="middle" class="cn tiny">H 平台、J&gt;0；吸力+铝箔约束</text>

  <!-- Card 4 invasion -->
  <text x="1195" y="374" text-anchor="middle" class="cn label">E3→E4：侵气与液桥退缩</text>
  <rect x="1085" y="585" width="220" height="34" rx="4" fill="#aeb9c1"/>
  <rect x="1085" y="475" width="220" height="110" rx="5" fill="url(#dry)" stroke="#7792a3" stroke-width="2"/>
  <path d="M1085 475 L1305 475 L1305 510 Q1260 500 1230 525 Q1190 545 1150 515 Q1120 498 1085 520 Z" fill="#ffffff" fill-opacity="0.72"/>
  <path d="M1085 520 Q1120 498 1150 515 Q1190 545 1230 525 Q1260 500 1305 510" fill="none" stroke="#3f8fc2" stroke-width="4"/>
  <g class="particle">
    <circle cx="1112" cy="496" r="14"/><circle cx="1155" cy="512" r="16"/><circle cx="1198" cy="498" r="15"/>
    <circle cx="1240" cy="510" r="17"/><circle cx="1281" cy="493" r="14"/>
    <circle cx="1110" cy="553" r="16"/><circle cx="1155" cy="562" r="15"/><circle cx="1200" cy="552" r="17"/>
    <circle cx="1247" cy="558" r="16"/><circle cx="1285" cy="551" r="13"/>
  </g>
  <path d="M1142 455 L1142 416 M1248 455 L1248 416" stroke="#2f7db6" stroke-width="3"/>
  <polygon points="1142,416 1133,431 1151,431" fill="#2f7db6"/>
  <polygon points="1248,416 1239,431 1257,431" fill="#2f7db6"/>
  <text x="1195" y="646" text-anchor="middle" class="cn tiny">Sₗ(z) 下降；非饱和毛细供液</text>

  <!-- Card 5 disconnected -->
  <text x="1540" y="374" text-anchor="middle" class="cn label">E4→E6：断连、困液与定型</text>
  <rect x="1410" y="585" width="260" height="34" rx="4" fill="#aeb9c1"/>
  <rect x="1410" y="475" width="260" height="110" rx="5" fill="#d7e2e8" stroke="#7792a3" stroke-width="2"/>
  <g class="particle">
    <circle cx="1438" cy="500" r="15"/><circle cx="1480" cy="514" r="17"/><circle cx="1524" cy="498" r="16"/>
    <circle cx="1570" cy="516" r="18"/><circle cx="1617" cy="498" r="15"/><circle cx="1653" cy="512" r="13"/>
    <circle cx="1440" cy="554" r="16"/><circle cx="1487" cy="560" r="15"/><circle cx="1535" cy="551" r="17"/>
    <circle cx="1585" cy="558" r="16"/><circle cx="1630" cy="551" r="15"/>
  </g>
  <ellipse cx="1495" cy="536" rx="23" ry="12" fill="#5da7d1" stroke="#2f7db6" stroke-width="2"/>
  <ellipse cx="1600" cy="486" rx="17" ry="10" fill="#5da7d1" stroke="#2f7db6" stroke-width="2"/>
  <ellipse cx="1550" cy="535" rx="28" ry="15" class="gas"/>
  <path d="M1460 455 L1460 424 M1630 455 L1630 424" stroke="#2f7db6" stroke-width="2.5" stroke-dasharray="5 5"/>
  <polygon points="1460,424 1452,438 1468,438" fill="#2f7db6"/>
  <polygon points="1630,424 1622,438 1638,438" fill="#2f7db6"/>
  <text x="1540" y="646" text-anchor="middle" class="cn tiny">降速；孤立 NMP≠必然宏孔</text>

  <!-- Qualitative state chart -->
  <rect x="90" y="720" width="1620" height="315" rx="20" fill="#ffffff" stroke="#d5dee5" stroke-width="2"/>
  <text x="125" y="760" class="cn label">定性状态轨迹：用于安排测量，不代表目标 LFP 已测曲线</text>
  <line x1="210" y1="990" x2="1650" y2="990" class="axis"/>
  <polygon points="1650,990 1629,979 1629,1001" fill="#6c7f8d"/>
  <line x1="210" y1="805" x2="210" y2="990" class="axis"/>
  <text x="145" y="900" transform="rotate(-90 145 900)" class="cn small">归一化状态 / 风险代理</text>
  <text x="1570" y="1020" class="cn small">材料时间</text>

  <line x1="430" y1="800" x2="430" y2="990" class="guide"/>
  <line x1="650" y1="800" x2="650" y2="990" class="guide"/>
  <line x1="890" y1="800" x2="890" y2="990" class="guide"/>
  <line x1="1125" y1="800" x2="1125" y2="990" class="guide"/>
  <line x1="1450" y1="800" x2="1450" y2="990" class="guide"/>
  <text x="430" y="785" text-anchor="middle" class="cn tiny">E1?</text>
  <text x="650" y="785" text-anchor="middle" class="cn tiny">E2</text>
  <text x="890" y="785" text-anchor="middle" class="cn tiny">E3</text>
  <text x="1125" y="785" text-anchor="middle" class="cn tiny">E4</text>
  <text x="1450" y="785" text-anchor="middle" class="cn tiny">E6</text>

  <path d="M220 820 C360 830 480 890 650 918 C860 922 1260 922 1640 922" fill="none" stroke="#64798a" stroke-width="6"/>
  <text x="1520" y="913" class="cn tiny" fill="#64798a">H/H₀</text>
  <path d="M220 950 C320 855 520 842 760 845 C920 847 1050 858 1125 875 C1280 925 1450 950 1640 965" fill="none" stroke="#2f7db6" stroke-width="6"/>
  <text x="1532" y="956" class="cn tiny" fill="#2f7db6">J</text>
  <path d="M220 826 C580 827 760 830 890 840 C1040 865 1150 900 1320 936 C1470 956 1560 964 1640 970" fill="none" stroke="#5ba6c9" stroke-width="6" stroke-dasharray="12 8"/>
  <text x="1425" y="944" class="cn tiny" fill="#3680a5">Sₗ</text>
  <path d="M220 970 C420 967 500 948 650 905 C800 860 990 828 1640 820" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <text x="1530" y="812" class="cn tiny" fill="#a96300">E′ / τᵣ</text>
  <path d="M500 980 C690 970 740 900 830 875 C940 848 1080 846 1190 874 C1320 906 1450 935 1640 950" fill="none" stroke="#d94841" stroke-width="5" stroke-dasharray="5 7"/>
  <text x="1230" y="892" class="cn tiny" fill="#b52f2b">失效驱动力可在不同区间越界</text>

  <g transform="translate(110,1064)" class="cn">
    <rect width="1580" height="38" rx="10" fill="#eef3f6"/>
    <text x="20" y="26" class="small">关键：E2 后仍可能 J&gt;0；E4 后仍可能有孤立 NMP；E6 达标也不等于冷却、静置和后处理不再演化。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LFP–PVDF/NMP 厚涂极片的干燥状态与失效分叉</title>
  <desc id="desc">四个阶段从湿膜入炉、浓缩收缩、骨架锁定和毛细供液，到侵气后的表面裂纹、层内空洞和界面脱粘。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2D7FC1"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C64E4E"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5D6973"/></marker>
    <style><![CDATA[
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1F2D36}
      .title{font-size:38px;font-weight:600}.subtitle{font-size:20px;fill:#51616D}.panel-title{font-size:25px;font-weight:600}
      .label{font-size:18px}.small{font-size:15px;fill:#455560}.panel{fill:#F8FBFD;stroke:#C9D4DB;stroke-width:2}
      .liquid{fill:#DDEFFD}.substrate{fill:#9EA8AF}.lfp{fill:#72AA78;stroke:#3D7650;stroke-width:2}
      .carbon{fill:#263238}.binder{fill:none;stroke:#D98B3A;stroke-width:4;stroke-linecap:round}.skin{fill:#E9B66B;fill-opacity:.45;stroke:#C6812E;stroke-dasharray:8 6;stroke-width:2}
      .stress{stroke:#C64E4E;stroke-width:4;marker-end:url(#arrow-red)}.evap{stroke:#2D7FC1;stroke-width:4;marker-end:url(#arrow-blue)}
      .flow{stroke:#2D7FC1;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.process{stroke:#5D6973;stroke-width:4;marker-end:url(#arrow-gray)}
    ]]></style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="70" y="65" class="title">LFP–PVDF/NMP 厚涂极片：干燥状态与失效分叉</text>
  <text x="70" y="100" class="subtitle">同一条干燥主干可分叉为通道裂纹、层内空洞/内裂和界面脱粘</text>

  <rect x="55" y="145" width="350" height="610" rx="18" class="panel"/>
  <rect x="435" y="145" width="350" height="610" rx="18" class="panel"/>
  <rect x="815" y="145" width="350" height="610" rx="18" class="panel"/>
  <rect x="1195" y="145" width="350" height="610" rx="18" class="panel"/>
  <path d="M405 450 H430" class="process"/><path d="M785 450 H810" class="process"/><path d="M1165 450 H1190" class="process"/>

  <text x="80" y="190" class="panel-title">① 湿膜入炉</text>
  <text x="80" y="220" class="small">LFP + 炭黑 + 溶解 PVDF + NMP</text>
  <rect x="85" y="320" width="290" height="300" rx="8" class="liquid"/>
  <rect x="78" y="620" width="304" height="26" rx="4" class="substrate"/>
  <circle cx="135" cy="390" r="34" class="lfp"/><circle cx="225" cy="365" r="42" class="lfp"/><circle cx="318" cy="420" r="38" class="lfp"/>
  <circle cx="175" cy="500" r="39" class="lfp"/><circle cx="277" cy="530" r="45" class="lfp"/><circle cx="345" cy="565" r="25" class="lfp"/>
  <circle cx="105" cy="535" r="8" class="carbon"/><circle cx="205" cy="450" r="7" class="carbon"/><circle cx="290" cy="345" r="8" class="carbon"/><circle cx="325" cy="500" r="7" class="carbon"/>
  <path d="M112 450 C145 428 163 464 195 440" class="binder"/><path d="M240 470 C270 446 290 475 330 455" class="binder"/>
  <ellipse cx="335" cy="355" rx="17" ry="12" fill="#FFFFFF" stroke="#6E8798" stroke-width="2"/>
  <text x="98" y="690" class="label">初始夹气/团聚宏孔是零假设</text>

  <text x="460" y="190" class="panel-title">② 浓缩与收缩</text>
  <text x="460" y="220" class="small">蒸发诱导对流与组分扩散竞争</text>
  <rect x="465" y="385" width="290" height="235" rx="8" class="liquid"/>
  <rect x="458" y="620" width="304" height="26" rx="4" class="substrate"/>
  <line x1="510" y1="375" x2="510" y2="285" class="evap"/><line x1="610" y1="375" x2="610" y2="270" class="evap"/><line x1="710" y1="375" x2="710" y2="285" class="evap"/>
  <circle cx="505" cy="440" r="38" class="lfp"/><circle cx="590" cy="430" r="42" class="lfp"/><circle cx="690" cy="445" r="39" class="lfp"/>
  <circle cx="540" cy="535" r="43" class="lfp"/><circle cx="635" cy="530" r="46" class="lfp"/><circle cx="720" cy="555" r="30" class="lfp"/>
  <circle cx="480" cy="520" r="8" class="carbon"/><circle cx="560" cy="390" r="7" class="carbon"/><circle cx="665" cy="385" r="8" class="carbon"/><circle cx="735" cy="485" r="7" class="carbon"/>
  <path d="M490 500 C530 470 555 506 600 480" class="binder"/><path d="M610 470 C650 442 680 475 730 455" class="binder"/>
  <text x="485" y="690" class="label">湿厚下降；各组分有独立 Pe</text>

  <text x="840" y="190" class="panel-title">③ 骨架锁定</text>
  <text x="840" y="220" class="small">厚度停止下降，孔内仍可毛细供液</text>
  <rect x="845" y="410" width="290" height="210" rx="8" fill="#CFE5F4"/>
  <rect x="838" y="620" width="304" height="26" rx="4" class="substrate"/>
  <rect x="845" y="398" width="290" height="28" class="skin"/>
  <circle cx="885" cy="455" r="37" class="lfp"/><circle cx="966" cy="450" r="42" class="lfp"/><circle cx="1065" cy="458" r="39" class="lfp"/>
  <circle cx="920" cy="535" r="43" class="lfp"/><circle cx="1015" cy="535" r="46" class="lfp"/><circle cx="1100" cy="555" r="30" class="lfp"/>
  <path d="M900 575 C905 520 900 470 915 422" class="flow"/><path d="M1035 575 C1040 520 1038 472 1050 420" class="flow"/>
  <line x1="965" y1="385" x2="965" y2="300" class="evap"/>
  <line x1="935" y1="660" x2="850" y2="660" class="stress"/><line x1="1045" y1="660" x2="1130" y2="660" class="stress"/>
  <text x="852" y="286" class="small">可能的表层富集/低渗层</text>
  <text x="855" y="704" class="label">毛细吸力 + 受限收缩 + 松弛</text>

  <text x="1220" y="190" class="panel-title">④ 侵气与失效分叉</text>
  <text x="1220" y="220" class="small">最终二维截面不足以唯一反演机制</text>
  <rect x="1225" y="390" width="290" height="230" rx="8" fill="#EAF3F7"/>
  <rect x="1218" y="620" width="304" height="26" rx="4" class="substrate"/>
  <circle cx="1265" cy="455" r="37" class="lfp"/><circle cx="1348" cy="450" r="42" class="lfp"/><circle cx="1450" cy="460" r="39" class="lfp"/>
  <circle cx="1297" cy="535" r="43" class="lfp"/><circle cx="1390" cy="535" r="46" class="lfp"/><circle cx="1480" cy="555" r="30" class="lfp"/>
  <path d="M1365 390 L1355 440 L1370 475 L1350 525 L1360 620" fill="none" stroke="#C64E4E" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="1460" cy="505" rx="34" ry="23" fill="#FFFFFF" stroke="#C64E4E" stroke-width="4"/>
  <path d="M1255 618 Q1300 602 1345 618" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <line x1="1435" y1="350" x2="1380" y2="420" class="stress"/><text x="1390" y="330" class="label">通道裂纹</text>
  <line x1="1490" y1="545" x2="1480" y2="520" class="stress"/><text x="1392" y="575" class="small">气泡/空化/内裂</text>
  <text x="1235" y="680" class="small">界面脱粘</text>
  <text x="1230" y="716" class="label">起裂、严重度和脱粘需分开判定</text>

  <rect x="70" y="790" width="1460" height="72" rx="14" fill="#F1F5F7"/>
  <circle cx="105" cy="826" r="12" class="lfp"/><text x="128" y="833" class="label">LFP 颗粒</text>
  <circle cx="280" cy="826" r="7" class="carbon"/><text x="298" y="833" class="label">炭黑</text>
  <path d="M405 826 C430 805 450 844 476 822" class="binder"/><text x="492" y="833" class="label">PVDF 网络</text>
  <rect x="650" y="812" width="36" height="28" class="liquid"/><text x="700" y="833" class="label">NMP</text>
  <line x1="825" y1="826" x2="895" y2="826" class="stress"/><text x="915" y="833" class="label">面内干燥应力</text>
  <text x="1175" y="833" class="label" fill="#7A3540">共同主干 ≠ 单一缺陷机制</text>
</svg>

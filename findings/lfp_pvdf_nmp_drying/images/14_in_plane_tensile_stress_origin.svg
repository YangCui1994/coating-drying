<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">厚涂极片干燥中面内拉应力的产生、传递与开裂驱动力</title>
  <desc id="svg-desc">六个面板依次区分溶剂通量与毛细加载、自由膜与铝箔约束膜、厚向状态梯度、干燥加载与应力松弛、均匀中央区与载荷传递剪切区，以及通道裂纹的能量判据。</desc>
  <defs>
    <linearGradient id="wet-to-dry" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d9efff"/>
      <stop offset="48%" stop-color="#f2f6f8"/>
      <stop offset="100%" stop-color="#fde1bb"/>
    </linearGradient>
    <linearGradient id="stress-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fde8e7"/>
      <stop offset="100%" stop-color="#c73e36"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2376c9"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#c9362b"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58636f"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #18212b; }
      .title { font-size: 43px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #4b5966; }
      .panel { fill: #ffffff; stroke: #aeb9c4; stroke-width: 2.5; }
      .panel-title { font-size: 28px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #4b5966; }
      .tiny { font-size: 16px; fill: #4b5966; }
      .eq { font-size: 24px; font-family: "STIX Two Math", "Times New Roman", "PingFang SC", serif; }
      .eq-small { font-size: 20px; font-family: "STIX Two Math", "Times New Roman", "PingFang SC", serif; }
      .blue { fill: #1769aa; }
      .red { fill: #b42318; }
      .orange { fill: #b85c00; }
      .green { fill: #276749; }
      .muted-box { fill: #f5f7f9; stroke: #cbd3da; stroke-width: 1.5; }
      .blue-box { fill: #e7f3ff; stroke: #6aa7d8; stroke-width: 1.5; }
      .red-box { fill: #fff0ef; stroke: #df8b84; stroke-width: 1.5; }
      .orange-box { fill: #fff4df; stroke: #dfab59; stroke-width: 1.5; }
      .particle { fill: #d7dde1; stroke: #43505a; stroke-width: 2; }
      .film { fill: #e9d8ad; stroke: #5d5546; stroke-width: 2; }
      .foil { fill: #87919a; stroke: #424b53; stroke-width: 2; }
      .blue-line { stroke: #2376c9; stroke-width: 4; fill: none; }
      .red-line { stroke: #c9362b; stroke-width: 4; fill: none; }
      .gray-line { stroke: #58636f; stroke-width: 3; fill: none; }
      .dash { stroke-dasharray: 10 8; }
      .dot { stroke-dasharray: 3 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1500" fill="#f7f9fb"/>
  <text x="900" y="55" text-anchor="middle" class="title">面内拉应力从哪里来？——骨架想缩，基材不让缩</text>
  <text x="900" y="92" text-anchor="middle" class="subtitle">坐标：x、y 为膜面内方向，z 为厚度方向；固体骨架拉应力取正</text>

  <!-- Panel A -->
  <rect x="34" y="120" width="850" height="330" rx="18" class="panel"/>
  <text x="62" y="160" class="panel-title">A　微观加载：毛细作用制造“自由收缩倾向”</text>

  <line x1="120" y1="330" x2="120" y2="213" class="blue-line" marker-end="url(#arrow-blue)"/>
  <line x1="225" y1="330" x2="225" y2="213" class="blue-line" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="330" x2="330" y2="213" class="blue-line" marker-end="url(#arrow-blue)"/>
  <text x="225" y="197" text-anchor="middle" class="body blue">溶剂通量 Jz ↑</text>
  <text x="225" y="222" text-anchor="middle" class="tiny">质量迁移 ≠ 机械力</text>

  <circle cx="135" cy="350" r="48" class="particle"/>
  <circle cx="305" cy="350" r="48" class="particle"/>
  <circle cx="220" cy="277" r="44" class="particle"/>
  <path d="M174 330 Q220 372 266 330" class="blue-line"/>
  <path d="M174 328 Q220 292 266 328" class="blue-line" opacity="0.5"/>
  <line x1="151" y1="350" x2="194" y2="350" class="blue-line" marker-end="url(#arrow-blue)"/>
  <line x1="289" y1="350" x2="246" y2="350" class="blue-line" marker-end="url(#arrow-blue)"/>
  <text x="220" y="379" text-anchor="middle" class="tiny blue">Fcap：颗粒相互靠近</text>
  <text x="220" y="405" text-anchor="middle" class="eq blue">pc = pg − pl &gt; 0</text>

  <rect x="410" y="195" width="430" height="202" rx="14" class="blue-box"/>
  <text x="430" y="240" class="body" font-weight="700">弯月面 / 液桥</text>
  <text x="430" y="285" class="body">颗粒靠近　·　孔隙缩小</text>
  <text x="430" y="325" class="small">毛细加载</text>
  <text x="430" y="363" class="eq red">dpreferred ↓　⇒　εfree &lt; 0</text>

  <!-- Panel B -->
  <rect x="916" y="120" width="850" height="330" rx="18" class="panel"/>
  <text x="944" y="160" class="panel-title">B　反事实：自由膜 vs 铝箔约束膜</text>

  <text x="956" y="202" class="body" font-weight="700">自由膜</text>
  <rect x="1050" y="184" width="260" height="48" rx="8" class="film"/>
  <text x="1180" y="215" text-anchor="middle" class="body">湿态 100 mm</text>
  <line x1="1332" y1="208" x2="1395" y2="208" class="gray-line" marker-end="url(#arrow-gray)"/>
  <rect x="1420" y="188" width="252" height="40" rx="8" class="film"/>
  <line x1="1445" y1="208" x2="1478" y2="208" class="gray-line" marker-end="url(#arrow-gray)"/>
  <line x1="1647" y1="208" x2="1614" y2="208" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="1546" y="215" text-anchor="middle" class="body">自由干态 97 mm</text>
  <text x="1546" y="251" text-anchor="middle" class="eq green">εactual = εfree，σ∥ = 0</text>

  <text x="956" y="300" class="body" font-weight="700">粘结铝箔</text>
  <rect x="1050" y="278" width="622" height="55" rx="8" class="film"/>
  <rect x="1040" y="333" width="642" height="30" rx="3" class="foil"/>
  <text x="1361" y="355" text-anchor="middle" fill="#ffffff" class="small">铝箔：约束共同实际应变</text>
  <rect x="1144" y="287" width="434" height="36" rx="6" fill="none" stroke="#59636e" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="1361" y="313" text-anchor="middle" class="small">虚线：骨架偏好的 97 mm</text>
  <line x1="1190" y1="300" x2="1090" y2="300" class="red-line" marker-end="url(#arrow-red)"/>
  <line x1="1532" y1="300" x2="1632" y2="300" class="red-line" marker-end="url(#arrow-red)"/>
  <text x="1361" y="392" text-anchor="middle" class="eq red">σ∥ = E′(εactual − εfree) ≈ −E′εfree &gt; 0</text>

  <!-- Panel C -->
  <rect x="34" y="472" width="850" height="392" rx="18" class="panel"/>
  <text x="62" y="512" class="panel-title">C　厚向状态：各层想缩多少、能否承载与松弛</text>

  <rect x="82" y="555" width="470" height="222" rx="8" fill="url(#wet-to-dry)" stroke="#59636e" stroke-width="2"/>
  <rect x="82" y="777" width="470" height="34" class="foil"/>
  <text x="317" y="801" text-anchor="middle" fill="#ffffff" class="small">铝箔 z = 0</text>
  <line x1="57" y1="780" x2="57" y2="574" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="46" y="569" class="body">z</text>

  <text x="101" y="586" class="body" font-weight="700">表层：先干、先锁定</text>
  <text x="101" y="618" class="small">NMP↓　E′↑　τr↑　|εfree|↑</text>
  <line x1="260" y1="645" x2="144" y2="645" class="red-line" marker-end="url(#arrow-red)"/>
  <line x1="374" y1="645" x2="490" y2="645" class="red-line" marker-end="url(#arrow-red)"/>
  <text x="317" y="670" text-anchor="middle" class="small red">较早出现较大 σ∥</text>

  <text x="101" y="714" class="body" font-weight="700">底层：后干、仍可松弛</text>
  <text x="101" y="746" class="small">NMP↑　E′↓　流动/蠕变仍可能</text>
  <line x1="280" y1="762" x2="230" y2="762" stroke="#c9362b" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="354" y1="762" x2="404" y2="762" stroke="#c9362b" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="584" y="548" width="262" height="272" rx="12" class="muted-box"/>
  <text x="715" y="578" text-anchor="middle" class="body" font-weight="700">定性厚向剖面</text>
  <line x1="626" y1="785" x2="626" y2="606" class="gray-line" marker-end="url(#arrow-gray)"/>
  <line x1="626" y1="785" x2="816" y2="785" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="610" y="604" class="small">z</text>
  <text x="798" y="810" class="small">量值</text>
  <path d="M638 765 C680 752 711 711 800 620" stroke="#2376c9" stroke-width="4" fill="none"/>
  <text x="752" y="644" class="tiny blue">锁定 λ、E′</text>
  <path d="M640 624 C690 655 730 715 802 760" stroke="#1769aa" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
  <text x="746" y="742" class="tiny blue">NMP</text>
  <path d="M643 750 C695 720 735 676 802 646" stroke="#c9362b" stroke-width="4" fill="none"/>
  <text x="730" y="688" class="tiny red">σ∥（示意）</text>
  <text x="62" y="843" class="eq-small">σ∥(z)=E′(z)[ε₀+(z−zr)κ−εfree(z)]</text>

  <!-- Panel D -->
  <rect x="916" y="472" width="850" height="392" rx="18" class="panel"/>
  <text x="944" y="512" class="panel-title">D　时间竞争：什么时候拉应力才会积累？</text>

  <line x1="980" y1="610" x2="1690" y2="610" class="gray-line" marker-end="url(#arrow-gray)"/>
  <circle cx="1030" cy="610" r="14" fill="#72a9d1"/>
  <circle cx="1240" cy="610" r="14" fill="#d69e2e"/>
  <circle cx="1480" cy="610" r="14" fill="#d97706"/>
  <circle cx="1670" cy="610" r="14" fill="#c9362b"/>
  <text x="1030" y="574" text-anchor="middle" class="body" font-weight="700">可流动</text>
  <text x="1240" y="574" text-anchor="middle" class="body" font-weight="700">机械锁定</text>
  <text x="1480" y="574" text-anchor="middle" class="body" font-weight="700">继续失溶剂</text>
  <text x="1670" y="574" text-anchor="middle" class="body" font-weight="700">失效窗口</text>
  <text x="1030" y="646" text-anchor="middle" class="small">颗粒重排/流动</text>
  <text x="1240" y="646" text-anchor="middle" class="small">形成承载路径</text>
  <text x="1480" y="646" text-anchor="middle" class="small">εfree 更负</text>
  <text x="1670" y="646" text-anchor="middle" class="small">强度/能量越界</text>

  <rect x="958" y="678" width="766" height="70" rx="12" class="red-box"/>
  <text x="1341" y="720" text-anchor="middle" class="eq">dσ∥/dt + σ∥/τr = E′(dεactual/dt − dεfree/dt)</text>
  <rect x="958" y="764" width="367" height="68" rx="12" class="blue-box"/>
  <text x="1142" y="794" text-anchor="middle" class="body" font-weight="700">τr ≪ tload：松弛较快</text>
  <text x="1142" y="820" text-anchor="middle" class="small">应力释放</text>
  <rect x="1357" y="764" width="367" height="68" rx="12" class="orange-box"/>
  <text x="1541" y="794" text-anchor="middle" class="body" font-weight="700">τr ≫ tload：加载较快</text>
  <text x="1541" y="820" text-anchor="middle" class="small">拉应力积累</text>

  <!-- Panel E -->
  <rect x="34" y="886" width="850" height="430" rx="18" class="panel"/>
  <text x="62" y="926" class="panel-title">E　受约束 ≠ 中央界面处处承受大剪切</text>

  <rect x="100" y="1045" width="700" height="80" rx="5" class="film"/>
  <rect x="82" y="1125" width="736" height="36" rx="3" class="foil"/>
  <text x="450" y="1150" text-anchor="middle" fill="#ffffff" class="small">铝箔</text>
  <rect x="100" y="1045" width="115" height="80" fill="#fff0d5" opacity="0.8"/>
  <rect x="685" y="1045" width="115" height="80" fill="#fff0d5" opacity="0.8"/>
  <text x="157" y="1031" text-anchor="middle" class="small orange">边缘传递区</text>
  <text x="742" y="1031" text-anchor="middle" class="small orange">边缘传递区</text>
  <text x="450" y="1031" text-anchor="middle" class="small green">均匀中央区</text>

  <line x1="390" y1="1084" x2="300" y2="1084" class="red-line" marker-end="url(#arrow-red)"/>
  <line x1="510" y1="1084" x2="600" y2="1084" class="red-line" marker-end="url(#arrow-red)"/>
  <text x="450" y="1076" text-anchor="middle" class="body red">σ∥ &gt; 0，Nx 近似恒定</text>

  <line x1="124" y1="1137" x2="176" y2="1137" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <line x1="192" y1="1137" x2="232" y2="1137" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="776" y1="1137" x2="724" y2="1137" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <line x1="708" y1="1137" x2="668" y2="1137" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <line x1="100" y1="997" x2="800" y2="997" stroke="#b9c2ca" stroke-width="2"/>
  <path d="M100 997 C145 997 170 962 235 958 L665 958 C730 962 755 997 800 997" stroke="#c9362b" stroke-width="4" fill="none"/>
  <text x="450" y="952" text-anchor="middle" class="small red">膜内合力 Nx(x)</text>
  <text x="66" y="1218" class="eq-small">Nx = ∫₀ʰ σxx dz　；　Mx = ∫₀ʰ(z−zr)σxx dz</text>
  <text x="66" y="1249" class="eq-small">τi = −∂Nx/∂x</text>
  <rect x="78" y="1264" width="762" height="40" rx="10" class="muted-box"/>
  <text x="459" y="1291" text-anchor="middle" class="small">∂c/∂z → σ(z)、Mx　　≠　　∂Nx/∂x → 界面载荷传递剪切</text>

  <!-- Panel F -->
  <rect x="916" y="886" width="850" height="430" rx="18" class="panel"/>
  <text x="944" y="926" class="panel-title">F　裂纹驱动力：拉应力张开，厚度增加储能</text>

  <rect x="970" y="985" width="300" height="170" rx="6" fill="#f0ddb3" stroke="#5d5546" stroke-width="2"/>
  <rect x="962" y="1155" width="316" height="32" rx="3" class="foil"/>
  <path d="M1120 985 L1112 1022 L1128 1050 L1114 1080 L1125 1115 L1120 1155" fill="none" stroke="#20262b" stroke-width="8"/>
  <line x1="1095" y1="1064" x2="1020" y2="1064" class="red-line" marker-end="url(#arrow-red)"/>
  <line x1="1145" y1="1064" x2="1220" y2="1064" class="red-line" marker-end="url(#arrow-red)"/>
  <text x="1120" y="960" text-anchor="middle" class="small red">通道裂纹由 σ∥ 张开</text>

  <rect x="1310" y="978" width="410" height="93" rx="12" class="red-box"/>
  <text x="1515" y="1010" text-anchor="middle" class="body" font-weight="700">起裂定位（局部强度）</text>
  <text x="1515" y="1049" text-anchor="middle" class="eq red">σmax ≥ σt(w)</text>
  <rect x="1310" y="1088" width="410" height="110" rx="12" class="orange-box"/>
  <text x="1515" y="1120" text-anchor="middle" class="body" font-weight="700">持续扩展（能量）</text>
  <text x="1515" y="1154" text-anchor="middle" class="eq">Gch ≈ Cint ∫₀ʰ σ∥²/E′ dz</text>
  <text x="1515" y="1184" text-anchor="middle" class="eq red">Gch ≥ Γc</text>
  <text x="944" y="1225" class="body">均匀近似：</text>
  <text x="1070" y="1225" class="eq">Gch ≈ C σ∥² h / E′</text>

  <!-- Bottom causal chain -->
  <rect x="34" y="1342" width="1732" height="118" rx="18" fill="#eef3f6" stroke="#aeb9c4" stroke-width="2"/>
  <text x="900" y="1378" text-anchor="middle" class="body" font-weight="700">完整因果链（箭头表示机制顺序，不表示所有量在空间上同方向）</text>
  <text x="111" y="1424" class="body blue">毛细加载</text>
  <line x1="220" y1="1417" x2="300" y2="1417" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="322" y="1424" class="body">εfree &lt; 0</text>
  <line x1="431" y1="1417" x2="511" y2="1417" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="533" y="1424" class="body orange">骨架锁定</text>
  <text x="650" y="1424" class="body">＋</text>
  <text x="680" y="1424" class="body">基材/邻层约束</text>
  <line x1="842" y1="1417" x2="922" y2="1417" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="944" y="1424" class="body red">σ∥ &gt; 0</text>
  <line x1="1042" y1="1417" x2="1122" y2="1417" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="1144" y="1424" class="body">弹性能累积</text>
  <line x1="1270" y1="1417" x2="1350" y2="1417" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="1372" y="1424" class="body red">强度/能量越界</text>
  <line x1="1531" y1="1417" x2="1601" y2="1417" class="gray-line" marker-end="url(#arrow-gray)"/>
  <text x="1620" y="1424" class="body red">开裂</text>
</svg>
